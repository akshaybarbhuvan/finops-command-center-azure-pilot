# Continuous integration for pull requests and the protected default branch.
# Runs only offline checks: no Azure credentials are used and nothing is deployed.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Bicep CLI
        # On GitHub-hosted runners Bicep is preinstalled on PATH, and `az bicep install` then exits 0 without
        # creating ~/.azure/bin/bicep (bicep.use_binary_from_path=if_found_in_ci). Resolve the binary that exists.
        run: |
          az bicep install
          if [ -x "$HOME/.azure/bin/bicep" ]; then BICEP_BIN="$HOME/.azure/bin/bicep"; else BICEP_BIN="$(command -v bicep || true)"; fi
          if [ -z "$BICEP_BIN" ] || [ ! -x "$BICEP_BIN" ]; then echo "::error::Bicep CLI not found after az bicep install"; exit 1; fi
          "$BICEP_BIN" --version
          echo "BICEP_BIN=$BICEP_BIN" >> "$GITHUB_ENV"
      - name: Demo build and validation (synthetic data, unchanged)
        run: npm run validate:demo
      - name: Pilot validation (type check, lint, tests, Bicep, pilot build, bundle scan, server smoke tests)
        run: npm run validate:pilot

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Production dependency audit
        # Fails on high or critical findings in production dependencies (what ships to App Service).
        # Open moderate (DEP-3) and build-tool (DEP-2) findings are NOT risk-accepted: they are tracked in
        # docs/PILOT_READINESS_REPORT.md §5a and need a recorded decision by the security owner and business sponsor.
        run: npm audit --omit=dev --audit-level=high
